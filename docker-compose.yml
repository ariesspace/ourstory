services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "${OUR_STORY_HTTP_BIND:-0.0.0.0}:${OUR_STORY_HTTP_PORT:-8090}:80"
    volumes:
      - ./app/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    command: sh -c "mkdir -p storage/data && chown -R www-data:www-data storage && php-fpm"
    environment:
      TALLY_WEBHOOK_SECRET: "${TALLY_WEBHOOK_SECRET:-}"
    volumes:
      - ./app:/var/www/html
      - our_story_data:/var/www/html/storage/data
    restart: unless-stopped

volumes:
  our_story_data:
